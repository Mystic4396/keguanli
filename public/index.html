<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>课时管理系统</title>
<style>
:root{--p:#4F46E5;--pl:#6366F1;--pb:#EEF2FF;--ok:#10B981;--ob:#D1FAE5;--no:#EF4444;--nb:#FEE2E2;--wn:#F59E0B;--wb:#FEF3C7;--g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;--g400:#9CA3AF;--g500:#6B7280;--g600:#4B5563;--g700:#374151;--g800:#1F2937;--g900:#111827;--r:12px;--sh:0 1px 3px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--g50);color:var(--g800);min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.page{display:none;min-height:100vh}.page.active{display:block}

/* Landing */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}
.landing-title{color:#fff;font-size:26px;font-weight:700;margin-bottom:6px}
.landing-sub{color:rgba(255,255,255,.8);font-size:14px;margin-bottom:36px}
.landing-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:640px}
.lc{background:#fff;border-radius:20px;padding:36px 32px;width:260px;text-align:center;cursor:pointer;transition:all .3s;box-shadow:0 10px 25px rgba(0,0,0,.15)}
.lc:hover{transform:translateY(-4px)}.lc .icon{font-size:44px;margin-bottom:14px}.lc h3{font-size:18px;margin-bottom:6px}.lc p{font-size:13px;color:var(--g500);line-height:1.5}
.lc.c1{border-top:4px solid var(--p)}.lc.c2{border-top:4px solid var(--ok)}

/* Header */
.header{background:#fff;border-bottom:1px solid var(--g200);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hleft{display:flex;align-items:center;gap:10px}
.bbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--g200);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.bbtn:hover{background:var(--g100)}.htitle{font-size:17px;font-weight:600}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge-c{background:var(--pb);color:var(--p)}.badge-p{background:var(--ob);color:var(--ok)}

/* Container */
.ctn{max-width:600px;margin:0 auto;padding:16px 14px 100px}

/* Login */
.login-box{max-width:380px;margin:50px auto;background:#fff;border-radius:20px;padding:36px 28px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
.login-box h2{font-size:20px;text-align:center;margin-bottom:4px}.login-sub{text-align:center;color:var(--g500);font-size:13px;margin-bottom:24px}
.fg{margin-bottom:16px}.fg label{display:block;font-size:13px;font-weight:500;color:var(--g700);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;border:1.5px solid var(--g200);border-radius:10px;font-size:14px;outline:none;background:#fff;transition:border .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.fg textarea{resize:vertical;min-height:60px}
.fg .hint{font-size:11px;color:var(--g400);margin-top:3px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s;width:100%;gap:6px}
.btn:active{transform:scale(.97)}.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--pl)}.btn-p:disabled{background:var(--g300);cursor:not-allowed;transform:none}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#059669}
.btn-no{background:var(--no);color:#fff}.btn-no:hover{background:#DC2626}
.btn-o{background:#fff;color:var(--g700);border:1.5px solid var(--g200)}.btn-o:hover{background:var(--g50)}
.btn-sm{padding:8px 14px;font-size:12px;width:auto;border-radius:8px}

/* Cards */
.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.stitle{font-size:15px;font-weight:600;color:var(--g800);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* Stats */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.sc{background:#fff;border-radius:var(--r);padding:16px 14px;box-shadow:var(--sh)}
.sc .sv{font-size:26px;font-weight:700;color:var(--g900)}.sc .sl{font-size:12px;color:var(--g500);margin-top:2px}

/* Search */
.search-row{display:flex;gap:8px;margin-bottom:0}
.search-row input{flex:1;padding:11px 12px;border:1.5px solid var(--g200);border-radius:10px;font-size:14px;outline:none}
.search-row input:focus{border-color:var(--p)}
.search-row.ok input:focus{border-color:var(--ok)}

/* Match items */
.mlist{max-height:220px;overflow-y:auto;margin-top:8px}
.mi{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--g100);cursor:pointer;transition:background .15s}
.mi:last-child{border-bottom:none}.mi:hover{background:var(--g50);margin:0 -18px;padding:12px 18px;border-radius:8px}
.mi .mn{font-size:14px;font-weight:500}.mi .mid{font-size:11px;color:var(--g400)}
.mi .mc{font-size:13px;font-weight:600;color:var(--p)}

/* Info rows */
.irow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--g100)}.irow:last-child{border-bottom:none}
.il{font-size:13px;color:var(--g500)}.iv{font-size:14px;font-weight:600;color:var(--g800)}.iv.hl{color:var(--p);font-size:18px}

/* Action buttons row */
.act-row{display:flex;gap:8px;margin-top:8px}
.act-row .btn{flex:1}

/* Day groups */
.dg{margin-bottom:8px}
.dh{font-size:13px;font-weight:600;color:var(--g700);padding:8px 0 4px;border-top:1px solid var(--g200);display:flex;align-items:center;gap:6px}
.dc{font-size:11px;color:var(--g400)}
.fb{font-size:11px;color:var(--p);cursor:pointer;padding:2px 8px;border-radius:4px;background:var(--pb);border:none;font-weight:500}
.fb:hover{background:var(--p);color:#fff}
.dr.folded .ri:nth-child(n+6){display:none}

/* Record item */
.ri{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--g100);gap:10px}.ri:last-child{border-bottom:none}
.rd{width:7px;height:7px;border-radius:50%;background:var(--p);flex-shrink:0}
.rm{flex:1;min-width:0}.rn{font-size:14px;font-weight:500}.rmt{font-size:12px;color:var(--g400);margin-top:1px}
.rb{font-size:11px;padding:2px 8px;border-radius:16px;font-weight:500;white-space:nowrap}
.rb-no{background:var(--nb);color:var(--no)}.rb-p{background:var(--pb);color:var(--p)}.rb-ok{background:var(--ob);color:var(--ok)}

/* Student list */
.sli{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--g100)}.sli:last-child{border-bottom:none}
.sli-info{display:flex;align-items:center;gap:10px}
.sav{width:34px;height:34px;border-radius:10px;background:var(--pb);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--p)}
.sn{font-size:14px;font-weight:500}.sid{font-size:11px;color:var(--g400)}
.scls{font-size:13px;font-weight:600;color:var(--p)}
.sact{display:flex;gap:5px}
.abtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--g200);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.abtn:hover{background:var(--g50)}.abtn.dng:hover{background:var(--nb);border-color:var(--no)}

/* Tabs */
.tabs{display:flex;background:var(--g100);border-radius:10px;padding:3px;margin-bottom:16px}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;border-radius:8px;color:var(--g500);transition:all .2s}
.tab.on{background:#fff;color:var(--g800);box-shadow:var(--sh)}

/* Result */
.rh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rav{width:48px;height:48px;border-radius:14px;background:var(--ob);display:flex;align-items:center;justify-content:center;font-size:22px}
.rname{font-size:18px;font-weight:700;color:var(--g900)}.rid{font-size:12px;color:var(--g400)}
.cbadge{display:inline-flex;align-items:center;gap:4px;background:var(--ob);color:var(--ok);padding:6px 14px;border-radius:10px;font-weight:600;font-size:14px;margin-bottom:14px}
.cbadge .num{font-size:22px;font-weight:800}

/* Modal */
.mo{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center;padding:16px}
.mo.on{display:flex}
.md{background:#fff;border-radius:18px;padding:24px 20px;width:100%;max-width:380px;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.md h3{font-size:16px;font-weight:600;margin-bottom:16px;text-align:center}
.md-acts{display:flex;gap:8px;margin-top:16px}.md-acts .btn{flex:1}
.conf{text-align:center;color:var(--g600);font-size:14px;line-height:1.6}.conf strong{color:var(--g900)}

/* Toast */
.tc{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tst{background:var(--g800);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 20px rgba(0,0,0,.15);animation:ti .3s,to .3s 2.2s forwards;pointer-events:auto}
.tst.ok{background:var(--ok)}.tst.no{background:var(--no)}.tst.wn{background:var(--wn)}
@keyframes ti{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes to{from{opacity:1}to{opacity:0}}
.empty{text-align:center;padding:30px 16px;color:var(--g400)}.empty .ei{font-size:36px;margin-bottom:10px}.empty p{font-size:13px}
.loading{display:flex;align-items:center;justify-content:center;padding:16px;color:var(--g400);gap:8px;font-size:13px}
.sp{width:14px;height:14px;border:2px solid var(--g200);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.lc{width:100%;padding:28px 22px}.sg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="tc" id="tc"></div>

<!-- Landing -->
<div class="page active" id="pgLand">
  <div class="landing">
    <div class="landing-title">📚 课时管理系统</div>
    <div class="landing-sub">选择您的身份进入系统</div>
    <div class="landing-cards">
      <div class="lc c1" onclick="goCoachLogin()"><div class="icon">🏋️</div><h3>教练入口</h3><p>扣减/充值课时 · 管理学员</p></div>
      <div class="lc c2" onclick="goParent()"><div class="icon">👨‍👩‍👧</div><h3>家长入口</h3><p>查询课时 · 查看记录</p></div>
    </div>
  </div>
</div>

<!-- Coach Login -->
<div class="page" id="pgLogin">
  <div class="login-box">
    <h2>🔐 教练登录</h2>
    <p class="login-sub">仅限授权教练账号</p>
    <div class="fg"><label>账号</label><input id="inpUser" placeholder="请输入账号" autocomplete="off"></div>
    <div class="fg"><label>密码</label><input type="password" id="inpPwd" placeholder="请输入密码"></div>
    <button class="btn btn-p" id="btnLogin" onclick="doLogin()">登 录</button>
    <div style="text-align:center;margin-top:14px"><a href="#" onclick="goLand()" style="color:var(--g400);font-size:12px;text-decoration:none">← 返回</a></div>
  </div>
</div>

<!-- Coach Dashboard -->
<div class="page" id="pgCoach">
  <div class="header">
    <div class="hleft"><button class="bbtn" onclick="doLogout()">←</button><span class="htitle">课时管理</span></div>
    <span class="badge badge-c" id="coachBadge">教练</span>
  </div>
  <div class="ctn">
    <!-- Stats -->
    <div class="sg">
      <div class="sc"><div class="sv" id="sStu">0</div><div class="sl">在读学员</div></div>
      <div class="sc"><div class="sv" id="sToday">0</div><div class="sl">今日操作</div></div>
    </div>

    <!-- Deduct / Add Classes -->
    <div class="stitle">⚡ 课时操作</div>
    <div class="card">
      <div class="search-row"><input id="cSearch" placeholder="搜索学员姓名" oninput="cSearchStu()"></div>
      <div id="cMatchList" class="mlist" style="display:none"></div>
      <div id="selInfo" style="display:none">
        <div class="irow"><span class="il">姓名</span><span class="iv" id="iName">-</span></div>
        <div class="irow"><span class="il">编号</span><span class="iv" id="iId">-</span></div>
        <div class="irow"><span class="il">备注</span><span class="iv" id="iNote">-</span></div>
        <div class="irow"><span class="il">剩余课时</span><span class="iv hl" id="iCls">-</span></div>
        <div class="act-row">
          <button class="btn btn-no btn-sm" id="btnDeduct" onclick="doDeduct()" disabled>扣 1 节</button>
          <button class="btn btn-ok btn-sm" id="btnAdd" onclick="doAddClass()" disabled>充 1 节</button>
          <button class="btn btn-p btn-sm" id="btnAddN" onclick="showAddNModal()" disabled>充 N 节</button>
        </div>
      </div>
    </div>

    <!-- Records -->
    <div class="stitle">📋 操作记录</div>
    <div class="card"><div id="cRecList"></div><div class="empty" id="cRecEmpty"><div class="ei">📝</div><p>暂无记录</p></div></div>

    <!-- Student Management -->
    <div class="stitle" style="margin-top:4px">👥 学员管理</div>
    <div class="tabs">
      <button class="tab on" onclick="swTab('list',this)">学员列表</button>
      <button class="tab" onclick="swTab('add',this)">添加学员</button>
    </div>
    <div id="tabList" class="card"><div id="stuList"></div></div>
    <div id="tabAdd" class="card" style="display:none">
      <div class="fg"><label>姓名</label><input id="nName" placeholder="输入姓名"></div>
      <div class="fg"><label>编号</label><input id="nId" placeholder="自动生成"><p class="hint">可手动修改，如 S001</p></div>
      <div class="fg"><label>初始课时</label><input type="number" id="nCls" value="20" min="0"></div>
      <div class="fg"><label>备注</label><input id="nNote" placeholder="如：联系电话、课程类型等"></div>
      <button class="btn btn-p" onclick="doAddStu()">添加学员</button>
    </div>

    <!-- Backup -->
    <div class="stitle" style="margin-top:4px">💾 数据备份</div>
    <div class="card">
      <p style="font-size:13px;color:var(--g500);margin-bottom:10px">导出当前所有数据为文件，以防万一</p>
      <div style="display:flex;gap:8px"><a href="/api/export" download="keguanli_backup.json" class="btn btn-o" style="text-decoration:none;flex:1">JSON备份</a><a href="/api/export-html" download="keguanli_backup.html" class="btn btn-o" style="text-decoration:none;flex:1">📄 可读报表</a></div>
    </div>
  </div>
</div>

<!-- Parent Page -->
<div class="page" id="pgParent">
  <div class="header">
    <div class="hleft"><button class="bbtn" onclick="goLand()">←</button><span class="htitle">课时查询</span></div>
    <span class="badge badge-p">家长端</span>
  </div>
  <div class="ctn">
    <div class="card">
      <div class="search-row ok"><input id="pSearch" placeholder="输入学员姓名" onkeydown="if(event.key==='Enter')doPQuery()"></div>
      <div id="pMatchList" class="mlist" style="display:none"></div>
    </div>
    <div id="pResult" style="display:none">
      <div class="card">
        <div class="rh"><div class="rav" id="pAv">👦</div><div><div class="rname" id="pName">-</div><div class="rid" id="pId">-</div></div></div>
        <div class="cbadge">剩余 <span class="num" id="pCls">0</span> 节课</div>
      </div>
      <div class="stitle">📋 上课记录</div>
      <div class="card"><div id="pRecList"></div><div class="empty" id="pRecEmpty" style="display:none"><div class="ei">📝</div><p>暂无记录</p></div></div>
    </div>
    <div id="pNoRes" style="display:none"><div class="card"><div class="empty"><div class="ei">🔍</div><p>未找到该学员</p></div></div></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="mo" id="moEdit">
  <div class="md">
    <h3>✏️ 编辑学员</h3>
    <div class="fg"><label>姓名</label><input id="eName"></div>
    <div class="fg"><label>剩余课时</label><input type="number" id="eCls" min="0"></div>
    <div class="fg"><label>备注</label><input id="eNote"></div>
    <div class="md-acts"><button class="btn btn-o" onclick="clsMo('moEdit')">取消</button><button class="btn btn-p" onclick="doSaveEdit()">保存</button></div>
  </div>
</div>

<!-- Add N Classes Modal -->
<div class="mo" id="moAddN">
  <div class="md">
    <h3>💰 充值课时</h3>
    <div class="fg"><label>充值节数</label><input type="number" id="addNVal" min="1" value="5"></div>
    <div class="md-acts"><button class="btn btn-o" onclick="clsMo('moAddN')">取消</button><button class="btn btn-ok" onclick="doAddN()">确认充值</button></div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="mo" id="moConf">
  <div class="md">
    <h3 id="confTitle">确认</h3>
    <div class="conf" id="confBody"></div>
    <div class="md-acts"><button class="btn btn-o" onclick="clsMo('moConf')">取消</button><button class="btn btn-no" onclick="doConf()">确认</button></div>
  </div>
</div>

<script>
let coach = null, db = null, selId = null, editId = null, confCb = null;

// ===== API =====
async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || '操作失败');
  return d;
}

// ===== Nav =====
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
function goLand(){go('pgLand')}
function goCoachLogin(){go('pgLogin');document.getElementById('inpUser').value='';document.getElementById('inpPwd').value=''}
function goParent(){go('pgParent');document.getElementById('pSearch').value='';['pResult','pNoRes','pMatchList'].forEach(id=>document.getElementById(id).style.display='none')}

// ===== Auth =====
async function doLogin(){
  const u=document.getElementById('inpUser').value.trim(),p=document.getElementById('inpPwd').value.trim();
  if(!u||!p){toast('请输入账号和密码','wn');return}
  const b=document.getElementById('btnLogin');b.disabled=true;b.textContent='登录中...';
  try{const r=await api('POST','/api/login',{username:u,password:p});coach={...r,_pwd:p};toast('欢迎 '+r.name,'ok');enterCoach()}
  catch(e){toast(e.message,'no')}
  finally{b.disabled=false;b.textContent='登 录'}
}
function doLogout(){coach=null;goLand()}
async function enterCoach(){go('pgCoach');document.getElementById('coachBadge').textContent=coach.name;await refresh()}

// ===== Data =====
async function loadDB(){db=await api('GET','/api/data');return db}
async function save(updates){await api('PUT','/api/data',{auth:{username:coach.username,password:coach._pwd},updates})}

async function refresh(){
  try{
    await loadDB();
    document.getElementById('sStu').textContent=db.students.length;
    const today=new Date().toISOString().slice(0,10);
    document.getElementById('sToday').textContent=db.records.filter(r=>r.time&&r.time.startsWith(today)).length;
    document.getElementById('cSearch').value='';document.getElementById('cMatchList').style.display='none';
    document.getElementById('selInfo').style.display='none';selId=null;
    document.getElementById('btnDeduct').disabled=true;document.getElementById('btnAdd').disabled=true;document.getElementById('btnAddN').disabled=true;
    renderRecs(db.records,'cRecList','cRecEmpty','coach');
    renderStuList();
  }catch(e){toast('加载失败','no');console.error(e)}
}

// ===== Coach Search =====
function cSearchStu(){
  const q=document.getElementById('cSearch').value.trim(),ml=document.getElementById('cMatchList');
  selId=null;document.getElementById('selInfo').style.display='none';
  document.getElementById('btnDeduct').disabled=true;document.getElementById('btnAdd').disabled=true;document.getElementById('btnAddN').disabled=true;
  if(!q){ml.style.display='none';return}
  const m=db.students.filter(s=>s.name.includes(q));
  if(!m.length){ml.style.display='block';ml.innerHTML='<div style="text-align:center;padding:10px;color:var(--g400);font-size:13px">未找到学员</div>';return}
  ml.style.display='block';
  ml.innerHTML=m.map(s=>`<div class="mi" onclick="pickStu('${s.id}')"><div><div class="mn">${s.name}</div><div class="mid">${s.id}${s.note?' · '+s.note:''}</div></div><div class="mc">余${s.classes}节</div></div>`).join('');
}
function pickStu(id){
  const s=db.students.find(x=>x.id===id);if(!s)return;selId=id;
  document.getElementById('cMatchList').style.display='none';
  document.getElementById('cSearch').value=s.name;
  document.getElementById('iName').textContent=s.name;
  document.getElementById('iId').textContent=s.id;
  document.getElementById('iNote').textContent=s.note||'无';
  document.getElementById('iCls').textContent=s.classes+' 节';
  document.getElementById('selInfo').style.display='block';
  document.getElementById('btnDeduct').disabled=s.classes<=0;
  document.getElementById('btnAdd').disabled=false;
  document.getElementById('btnAddN').disabled=false;
}

// ===== Deduct =====
function doDeduct(){
  if(!selId)return;const s=db.students.find(x=>x.id===selId);
  if(!s||s.classes<=0){toast('课时不足','wn');return}
  showConf('确认扣课',`为 <strong>${s.name}</strong> 扣减 1 节课？<br>剩余：${s.classes} → ${s.classes-1}`,async()=>{
    const st=db.students.find(x=>x.id===selId);st.classes-=1;
    db.records.unshift({sid:selId,sname:st.name,coach:coach.name,time:new Date().toISOString(),after:st.classes,type:'扣',n:1});
    await save({students:db.students,records:db.records});
    toast('已扣减 1 节','ok');await refresh();pickStu(selId);
  });
}

// ===== Add 1 =====
async function doAddClass(){
  if(!selId)return;const s=db.students.find(x=>x.id===selId);if(!s)return;
  showConf('确认充值',`为 <strong>${s.name}</strong> 充值 1 节课？<br>剩余：${s.classes} → ${s.classes+1}`,async()=>{
    const st=db.students.find(x=>x.id===selId);st.classes+=1;
    db.records.unshift({sid:selId,sname:st.name,coach:coach.name,time:new Date().toISOString(),after:st.classes,type:'充',n:1});
    await save({students:db.students,records:db.records});
    toast('已充值 1 节','ok');await refresh();pickStu(selId);
  });
}

// ===== Add N =====
function showAddNModal(){document.getElementById('addNVal').value=5;document.getElementById('moAddN').classList.add('on')}
async function doAddN(){
  const n=parseInt(document.getElementById('addNVal').value)||0;
  if(n<=0){toast('请输入正数','wn');return}
  if(!selId)return;const s=db.students.find(x=>x.id===selId);if(!s)return;
  clsMo('moAddN');
  showConf('确认充值',`为 <strong>${s.name}</strong> 充值 ${n} 节课？<br>剩余：${s.classes} → ${s.classes+n}`,async()=>{
    const st=db.students.find(x=>x.id===selId);st.classes+=n;
    db.records.unshift({sid:selId,sname:st.name,coach:coach.name,time:new Date().toISOString(),after:st.classes,type:'充',n:n});
    await save({students:db.students,records:db.records});
    toast(`已充值 ${n} 节`,'ok');await refresh();pickStu(selId);
  });
}

// ===== Records =====
function groupByDay(recs){
  const g={};recs.forEach(r=>{const d=new Date(r.time),k=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';if(!g[k])g[k]=[];g[k].push(r)});return g;
}
function renderRecs(recs,elId,emptyId,mode){
  const el=document.getElementById(elId),em=document.getElementById(emptyId);
  if(!recs.length){el.innerHTML='';em.style.display='block';return}
  em.style.display='none';
  const g=groupByDay(recs);
  el.innerHTML=Object.entries(g).map(([day,rs])=>{
    const fold=rs.length>5;
    return `<div class="dg"><div class="dh">${day}<span class="dc">${rs.length}条</span>${fold?'<button class="fb" onclick="tFold(this)">展开</button>':''}</div><div class="dr${fold?' folded':''}">${rs.map(r=>renderRI(r,mode)).join('')}</div></div>`;
  }).join('');
}
function renderRI(r,mode){
  const d=new Date(r.time),t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(mode==='coach'){
    const isAdd=r.type==='充';
    return `<div class="ri"><div class="rd" style="background:${isAdd?'var(--ok)':'var(--p)'}"></div><div class="rm"><div class="rn">${r.sname}${isAdd?' · 充值':' · 扣减'} ${r.n}节</div><div class="rmt">${t} · ${r.coach}</div></div><div class="rb ${isAdd?'rb-ok':'rb-no'}">${isAdd?'+':'-'}${r.n}节 余${r.after}节</div></div>`;
  }
  const isAdd=r.type==='充';
  return `<div class="ri"><div class="rd" style="background:${isAdd?'var(--ok)':'var(--p)'}"></div><div class="rm"><div class="rn">${isAdd?'充值':'上课扣减'} ${r.n}节</div><div class="rmt">${t} · ${r.coach}</div></div><div class="rb ${isAdd?'rb-ok':'rb-p'}">余${r.after}节</div></div>`;
}
function tFold(b){const c=b.closest('.dg').querySelector('.dr'),f=c.classList.contains('folded');c.classList.toggle('folded');b.textContent=f?'收起':'展开'}

// ===== Student List =====
function renderStuList(){
  const a=document.getElementById('stuList');
  if(!db.students.length){a.innerHTML='<div class="empty"><div class="ei">👥</div><p>暂无学员</p></div>';return}
  a.innerHTML=db.students.sort((a,b)=>a.id.localeCompare(b.id)).map(s=>`
    <div class="sli">
      <div class="sli-info"><div class="sav">${s.name[0]}</div><div><div class="sn">${s.name}</div><div class="sid">${s.id}${s.note?' · '+s.note:''}</div></div></div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="scls">${s.classes}节</span>
        <div class="sact"><button class="abtn" onclick="openEdit('${s.id}')">✏️</button><button class="abtn dng" onclick="delStu('${s.id}')">🗑️</button></div>
      </div>
    </div>`).join('');
}

// ===== Add Student =====
function swTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  document.getElementById('tabList').style.display=t==='list'?'block':'none';
  document.getElementById('tabAdd').style.display=t==='add'?'block':'none';
  if(t==='add'){document.getElementById('nName').value='';document.getElementById('nId').value='S'+String(db.nextId).padStart(3,'0');document.getElementById('nCls').value='20';document.getElementById('nNote').value=''}
}
async function doAddStu(){
  const name=document.getElementById('nName').value.trim(),id=document.getElementById('nId').value.trim(),
  cls=parseInt(document.getElementById('nCls').value)||0,note=document.getElementById('nNote').value.trim();
  if(!name){toast('请输入姓名','wn');return}if(!id){toast('请输入编号','wn');return}
  if(db.students.find(s=>s.id===id)){toast('编号已存在','no');return}
  db.students.push({id,name,classes:cls,note:note||''});
  db.nextId=Math.max(db.nextId,parseInt(id.replace(/\D/g,''))+1);
  try{await save({students:db.students,nextId:db.nextId});toast(name+' 添加成功','ok');await refresh()}
  catch(e){toast('添加失败','no')}
}

// ===== Edit Student =====
function openEdit(id){
  const s=db.students.find(x=>x.id===id);if(!s)return;editId=id;
  document.getElementById('eName').value=s.name;document.getElementById('eCls').value=s.classes;document.getElementById('eNote').value=s.note||'';
  document.getElementById('moEdit').classList.add('on');
}
async function doSaveEdit(){
  const name=document.getElementById('eName').value.trim(),cls=parseInt(document.getElementById('eCls').value),note=document.getElementById('eNote').value.trim();
  if(!name){toast('姓名不能空','wn');return}if(isNaN(cls)||cls<0){toast('课时无效','wn');return}
  const s=db.students.find(x=>x.id===editId);s.name=name;s.classes=cls;s.note=note;
  try{await save({students:db.students});clsMo('moEdit');toast('已保存','ok');await refresh()}catch(e){toast('保存失败','no')}
}

// ===== Delete Student =====
function delStu(id){
  const s=db.students.find(x=>x.id===id);if(!s)return;
  showConf('删除学员',`确认删除 <strong>${s.name}</strong>（${s.id}）？<br>此操作不可恢复`,async()=>{
    db.students=db.students.filter(x=>x.id!==id);db.records=db.records.filter(r=>r.sid!==id);
    try{await save({students:db.students,records:db.records});toast('已删除','ok');await refresh()}catch(e){toast('删除失败','no')}
  });
}

// ===== Parent =====
async function doPQuery(){
  const q=document.getElementById('pSearch').value.trim();
  if(!q){toast('请输入姓名','wn');return}
  try{
    await loadDB();
    const m=db.students.filter(s=>s.name.includes(q));
    document.getElementById('pResult').style.display='none';document.getElementById('pNoRes').style.display='none';
    document.getElementById('pMatchList').style.display='none';
    if(!m.length){document.getElementById('pNoRes').style.display='block';return}
    if(m.length===1){showPDetail(m[0])}else{
      document.getElementById('pMatchList').style.display='block';
      document.getElementById('pMatchList').innerHTML=m.map(s=>`<div class="mi" onclick="showPDetail(db.students.find(x=>x.id==='${s.id}'))"><div><div class="mn">${s.name}</div><div class="mid">${s.id}</div></div><div class="mc">余${s.classes}节</div></div>`).join('');
    }
  }catch(e){toast('查询失败','no')}
}
function showPDetail(s){
  document.getElementById('pMatchList').style.display='none';document.getElementById('pNoRes').style.display='none';
  document.getElementById('pResult').style.display='block';
  document.getElementById('pName').textContent=s.name;document.getElementById('pId').textContent=s.id;document.getElementById('pCls').textContent=s.classes;
  const e=['👦','👧','🧒','👶','🧑'];document.getElementById('pAv').textContent=e[s.name.charCodeAt(0)%e.length];
  renderRecs(db.records.filter(r=>r.sid===s.id),'pRecList','pRecEmpty','parent');
}

// ===== Toast / Confirm / Modal =====
function toast(m,t=''){const c=document.getElementById('tc'),e=document.createElement('div');e.className='tst '+t;e.textContent=m;c.appendChild(e);setTimeout(()=>e.remove(),2600)}
function showConf(title,body,cb){document.getElementById('confTitle').textContent=title;document.getElementById('confBody').innerHTML=body;confCb=cb;document.getElementById('moConf').classList.add('on')}
function doConf(){if(confCb)confCb();clsMo('moConf')}
function clsMo(id){document.getElementById(id).classList.remove('on');if(id==='moConf')confCb=null}

// ===== Hash =====
const h=window.location.hash;
if(h==='#coach')goCoachLogin();else if(h==='#parent')goParent();
window.addEventListener('hashchange',()=>{const h2=window.location.hash;if(h2==='#coach')goCoachLogin();else if(h2==='#parent')goParent()});
</script>
